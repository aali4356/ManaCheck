name: Nightly verification stability
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-sequential-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check detector with synthetic XML
        run: python3 -m unittest discover -s scripts -p test_check_stability.py
      - name: Run the complete offline suite ten times sequentially
        run: python3 scripts/check_stability.py
      - name: Summarize every outcome
        if: always()
        run: |
          found=false
          for summary in stability-results/*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              found=true
            fi
          done
          if [ "$found" = false ]; then
            echo 'Stability verification failed before a sample was recorded; inspect preceding steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain all stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manacheck-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: stability-results/
          if-no-files-found: warn
          retention-days: 14
