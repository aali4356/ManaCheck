# The suite is the sole Cucumber entry point; keep Jupiter's existing discovery intact.
cucumber.junit-platform.discovery.as-root-engine=false
cucumber.junit-platform.naming-strategy=long
cucumber.plugin=pretty,json:target/cucumber/cucumber.json
# The cached Spring context shares a disposable database with the Jupiter tests.
cucumber.execution.parallel.enabled=false
junit.jupiter.execution.parallel.enabled=false
